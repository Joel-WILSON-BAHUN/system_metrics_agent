services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: metrics-api:local
    ports:
      - "8000:8000"
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    image: metrics-agent:local
    env_file:
      - .env
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true